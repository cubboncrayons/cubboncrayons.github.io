name: Whole website quality regression
on:
  push:
    paths:
      - 'index.html'
      - 'parent-corner*.html'
      - 'parent-corner/**'
      - 'purochi.html'
      - 'activities.html'
      - 'ajji-madila-haadugalu.html'
      - 'activities.css'
      - 'site-navigation.css'
      - 'site-navigation.js'
      - 'motion.js'
      - 'book-viewer.js'
      - '.github/workflows/whole-site-quality.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Browser dependencies
        run: npm install --no-save --no-package-lock playwright@1.58.2
      - name: Test core pages, mobile menu, previews, artwork and payment links
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8173 --bind 127.0.0.1 >/tmp/cc-web.log 2>&1 &
          node <<'JS'
          const {chromium}=require('playwright'),assert=require('node:assert/strict');
          const origin='http://127.0.0.1:8173';
          const pages=['/','/activities.html','/purochi.html','/ajji-madila-haadugalu.html','/parent-corner.html','/parent-corner-kannada.html','/parent-corner/sharing-a-favourite-toy.html','/parent-corner/sharing-a-favourite-toy-kn.html','/parent-corner/when-screen-goes-off.html','/parent-corner/when-screen-goes-off-kn.html'];
          (async()=>{
            const browser=await chromium.launch({headless:true});
            for(const width of [390,320,1280]){
              const context=await browser.newContext({viewport:{width,height:844}});
              for(const path of pages){
                const page=await context.newPage(),errors=[];
                page.on('pageerror',e=>errors.push(e.message));
                const response=await page.goto(origin+path,{waitUntil:'load'});
                assert.equal(response.status(),200,path+' HTTP status');
                await page.locator('.site-header').waitFor();
                const brokenImages=await page.locator('img').evaluateAll(els=>els.filter(i=>i.hasAttribute('src')&&i.complete&&!i.naturalWidth).map(i=>i.getAttribute('src')));
                assert.deepEqual(brokenImages,[],path+' broken images');
                const over=await page.evaluate(()=>({width:innerWidth,scroll:document.documentElement.scrollWidth}));
                assert.ok(over.scroll<=over.width+3,path+' horizontal overflow '+width+': '+JSON.stringify(over));
                if(width<=390){
                  const button=page.locator(path==='/activities.html'?'#activities-menu-toggle':'.cc-menu-toggle');
                  assert.equal(await button.count(),1,path+' mobile menu');
                  assert.equal(await button.isVisible(),true,path+' menu visible');
                  await button.click();assert.equal(await button.getAttribute('aria-expanded'),'true');
                  const nav=page.locator('.site-header nav[aria-label="Main navigation"]');
                  assert.equal(await nav.isVisible(),true);
                  assert.ok(await nav.locator('a[href="/activities.html"]').count()>=1,'Activities nav missing '+path);
                  assert.equal(await nav.locator('a').count(),4,path+' must show exactly four menu links');
                  const destinations=await nav.locator('a').evaluateAll(links=>links.map(a=>a.pathname+a.hash));
                  assert.equal(new Set(destinations).size,4,path+' duplicate menu destinations');
                  assert.deepEqual(destinations,['/#stories','/activities.html',(path.includes('-kn.html')||path.includes('kannada.html')||path==='/purochi.html')?'/parent-corner-kannada.html':'/parent-corner.html','/#our-story'],path+' menu ordering');
                  await page.keyboard.press('Escape');assert.equal(await button.getAttribute('aria-expanded'),'false');
                }
                if(path==='/'){
                  assert.equal(await page.locator('.card-buy').count(),5);
                  assert.equal(await page.locator('a[href^="https://payhip.com/b/"].card-buy').count(),5);
                  assert.ok(await page.getByRole('link',{name:'Explore free activities'}).count()>=1);
                  assert.ok(await page.locator('#headline').isVisible(),'Homepage headline hidden');
                  if(width<=390)assert.ok((await page.locator('#headline').evaluate(el=>getComputedStyle(el).opacity))>0,'Mobile headline opacity hidden');
                  await page.goto(origin+'/?preview=umbrella#previews',{waitUntil:'load'});
                  assert.equal(await page.locator('[data-book="umbrella"]').getAttribute('aria-pressed'),'true');
                }
                if(path==='/activities.html'){
                  for(const name of ['parents','grandparents','games']){
                    const img=page.locator('img[src="assets/activity-'+name+'-premium.jpg"]');
                    assert.equal(await img.count(),1);assert.ok(await img.evaluate(i=>i.naturalWidth>0),'missing artwork '+name);
                  }
                  assert.equal(await page.locator('a[href="https://payhip.com/b/I2Azi"]').count(),1);
                  assert.equal(await page.locator('.activity-item:not([hidden])').count(),4);
                  await page.locator('button[data-age="2-3"]').click();
                  assert.equal(await page.locator('.activity-item:not([hidden])').count(),2);
                }
                if(path==='/purochi.html'){assert.equal(await page.locator('#season-audio').count(),1);assert.equal(await page.locator('.season-card').count(),6)}
                assert.deepEqual(errors,[],path+' JS errors');
                if(width===390&&['/','/activities.html','/parent-corner.html','/purochi.html'].includes(path)) {
                  const filename=path==='/'?'home':path.split('/')[1].replace('.html','');
                  const shot=await page.screenshot({type:'jpeg',quality:55,fullPage:false});
                  console.log('CC_AUDIT_'+filename.toUpperCase()+'_START'+shot.toString('base64')+'CC_AUDIT_'+filename.toUpperCase()+'_END');
                }
                console.log('PASS',width,path);
                await page.close();
              }
              await context.close();
            }
            await browser.close();console.log('PASS all core pages, menus, layout, images and purchase-link markup');
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
