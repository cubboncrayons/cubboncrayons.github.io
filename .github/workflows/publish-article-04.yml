name: Publish selected Article 04 illustration
on:
  push:
    paths:
      - '.github/workflows/publish-article-04.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download selected Canva picture and update Article 04
        env:
          IMAGE_URL_B64: ''
        shell: bash
        run: |
          mkdir -p assets/parent-corner
          IMAGE_URL="$(printf '%s' "$IMAGE_URL_B64" | base64 --decode)"
          curl --fail --location --retry 3 --max-time 90 "$IMAGE_URL" -o assets/parent-corner/article-04-user-selected.png
          python - <<'PY'
          from pathlib import Path
          import struct,re
          p=Path('assets/parent-corner/article-04-user-selected.png')
          b=p.read_bytes()
          assert b[:8]==bytes.fromhex('89504e470d0a1a0a'), 'not a valid PNG'
          w,h=struct.unpack('>II',b[16:24])
          print('Selected Article 04 image',w,h,len(b))
          assert w>=370 and h>=500, 'Image resolution below minimum'
          new='/assets/parent-corner/article-04-user-selected.png?v=20261123-user-choice'
          for name in ('parent-corner/when-screen-goes-off.html','parent-corner/when-screen-goes-off-kn.html'):
              page=Path(name)
              html=page.read_text()
              html,count=re.subn(r'src="data:image/png;base64,[A-Za-z0-9+/=]+"',lambda m:'src="'+new+'"',html,count=1)
              if count!=1:
                  html,count=re.subn(r'src="/assets/parent-corner/article-04-cardboard-bus.png[^"]*"',lambda m:'src="'+new+'"',html,count=1)
              assert count==1, 'Hero image missing in '+name
              page.write_text(html)
          for name in ('parent-corner.html','parent-corner-kannada.html'):
              page=Path(name)
              html=page.read_text()
              old='/assets/parent-corner/article-04-cardboard-bus.png?v=20261123-canva'
              assert old in html, 'Article card image missing in '+name
              page.write_text(html.replace(old,new))
          PY
      - name: Commit final illustration
        run: |
          git config user.name "Cubbon Crayons Publishing"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/parent-corner/article-04-user-selected.png parent-corner.html parent-corner-kannada.html parent-corner/when-screen-goes-off.html parent-corner/when-screen-goes-off-kn.html
          git commit -m "Publish user-selected picture for Article 04"
          git pull --rebase origin main
          git push origin HEAD:main
