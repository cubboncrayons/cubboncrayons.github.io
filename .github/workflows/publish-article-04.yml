name: Publish Article 04 Canva artwork
on:
  push:
    paths:
      - '.github/workflows/publish-article-04.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve Article 04 Canva illustration
        run: |
          mkdir -p assets/parent-corner
          curl --fail --location --retry 3 --max-time 90 'https://design.canva.ai/QqGDoZZMW0kMHFE' -o assets/parent-corner/article-04-cardboard-bus.png
          python - <<'PY'
          import struct
          from pathlib import Path
          p=Path('assets/parent-corner/article-04-cardboard-bus.png')
          b=p.read_bytes()
          assert b[:8]==bytes.fromhex('89504e470d0a1a0a'), 'Canva response was not a PNG'
          w,h=struct.unpack('>II',b[16:24])
          print('Canva image',w,h,len(b))
          assert w>=370 and h>=500, 'Canva illustration too small'
          for name in ('parent-corner.html','parent-corner-kannada.html','parent-corner/when-screen-goes-off.html','parent-corner/when-screen-goes-off-kn.html'):
              f=Path(name)
              html=f.read_text()
              assert '/assets/parent-corner/article-04-bus.svg' in html, name
              f.write_text(html.replace('/assets/parent-corner/article-04-bus.svg','/assets/parent-corner/article-04-cardboard-bus.png?v=20261123-canva'))
          PY
      - name: Commit Article 04 image and pages
        run: |
          git config user.name "Cubbon Crayons Publishing"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/parent-corner/article-04-cardboard-bus.png parent-corner.html parent-corner-kannada.html parent-corner/when-screen-goes-off.html parent-corner/when-screen-goes-off-kn.html
          git commit -m "Publish Article 04 Canva picture"
          git pull --rebase origin main
          git push origin HEAD:main
