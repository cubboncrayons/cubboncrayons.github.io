name: Inspect Canva public image sharing
on:
  push:
    paths: ['.github/workflows/inspect-canva-view.yml']
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect published design previews
        shell: bash
        run: |
          mkdir -p /tmp/cc-designs image-diagnostics
          curl -sSL -m 20 -A 'Mozilla/5.0' 'https://www.canva.com/d/nHFa8B5nJW2-93O' -o /tmp/cc-designs/0.html || true
          curl -sSL -m 20 -A 'Mozilla/5.0' 'https://www.canva.com/d/lwYs2S3dnFfMPzR' -o /tmp/cc-designs/1.html || true
          python - <<'PY' > image-diagnostics/view-audit.txt
          import os,re,html
          for i in (0,1):
              p=f'/tmp/cc-designs/{i}.html'
              print('VIEW',i,os.path.getsize(p))
              s=open(p,errors='ignore').read()
              for pat in ('og:image','twitter:image','image-resize','document-image','image_url'):
                  j=s.find(pat)
                  print(pat,j, s[max(j-50,0):j+350] if j>=0 else '')
          PY
          git config user.name 'Cubbon Crayons Publishing'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add image-diagnostics/view-audit.txt
          git commit -m 'Record full quality image endpoint availability' && git push || true
