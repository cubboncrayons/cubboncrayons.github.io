name: Import approved Cubbon Crayons art
on:
  push:
    paths:
      - '.github/workflows/import-parent-art.yml'
permissions:
  contents: write
jobs:
  import-illustrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Import original approved image previews
        shell: bash
        run: |
          mkdir -p assets/parent-corner
          curl -fL --retry 2 --max-time 30 'https://media.canva.com/v2/image-resize/format:PNG/height:200/quality:100/uri:ifs%3A%2F%2FM%2F65ebfb2a-148a-4aeb-9c7c-bcdc8f77d085/watermark:F/width:160?csig=AAAAAAAAAAAAAAAAAAAAANTKjd9WxidqOnxFCV2rxSE9Y-DGC0HT_bkuq0dzCb6C&exp=1795353746&osig=AAAAAAAAAAAAAAAAAAAAAAW_I4WtvXjnMK5UMCBnzp6NCjWHvafvoqeSp2qQV7lJ&signer=media-rpc&token=AAIAAU0AJDY1ZWJmYjJhLTE0OGEtNGFlYi05YzdjLWJjZGM4Zjc3ZDA4NQAAAAABogNsGlAi9JUeDaZowItqNGWQ497noCLSbusLSKYstaQh9-9RRg&x-canva-quality=thumbnail' -o assets/parent-corner/appi-ajja-resilience.png
          curl -fL --retry 2 --max-time 30 'https://media.canva.com/v2/image-resize/format:PNG/height:200/quality:100/uri:ifs%3A%2F%2FM%2Ff230ff7e-f20a-45bf-894f-df4df9a96471/watermark:F/width:160?csig=AAAAAAAAAAAAAAAAAAAAADazLjJWnKvGl-DEfgMT-fENAGvxqmDPurmIafbd74SL&exp=1795356743&osig=AAAAAAAAAAAAAAAAAAAAAEVGcTUPiwWF0asvF6ZfBEf_ArNMgwtHoPDrBr1Qbgco&signer=media-rpc&token=AAIAAU0AJGYyMzBmZjdlLWYyMGEtNDViZi04OTRmLWRmNGRmOWE5NjQ3MQAAAAABogOZ1VgKc4-byuRONuIg5U2kt6VTNDpNZ52-1clJmcdRbe5WnA&x-canva-quality=thumbnail' -o assets/parent-corner/appi-cardboard-rocket.png
          file assets/parent-corner/*.png
          test "$(wc -c < assets/parent-corner/appi-ajja-resilience.png)" -gt 1000
          test "$(wc -c < assets/parent-corner/appi-cardboard-rocket.png)" -gt 1000
      - name: Commit permanent image assets
        run: |
          git config user.name "Cubbon Crayons Publishing"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/parent-corner/appi-ajja-resilience.png assets/parent-corner/appi-cardboard-rocket.png
          git commit -m "Add permanent illustrations for articles 02 and 03" || exit 0
          git push
