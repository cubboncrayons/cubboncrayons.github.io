name: Import Dharwad lullaby audio
on:
  push:
    paths:
      - '.github/workflows/import-dharwad-audio.yml'
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Import and verify exact uploaded audio
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/audio
          curl --fail --location --retry 2 --max-time 60 'https://at.adobe.com/6iNHFno3nqTRdiqM' -o /tmp/dharwad.mp3
          echo '02e186e60c95d05147213d38bb5fb1046781ac63ff9f391406e4dca31762ce1b  /tmp/dharwad.mp3' | sha256sum -c -
          cp /tmp/dharwad.mp3 assets/audio/dharwad-lullaby-cleaned.mp3
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/audio/dharwad-lullaby-cleaned.mp3
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Import checksum-verified Dharwad lullaby MP3'
          git push
