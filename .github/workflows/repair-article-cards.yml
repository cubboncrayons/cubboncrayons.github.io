name: Repair blurry article cards
on:
  push:
    paths:
      - '.github/workflows/repair-article-cards.yml'
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upscale and clarify the current images
        run: |
          python -m pip install -q pillow
          python - <<'PY'
          from PIL import Image, ImageFilter, ImageEnhance
          for p in ['assets/parent-corner/appi-ajja-resilience.png','assets/parent-corner/appi-cardboard-rocket.png']:
              im=Image.open(p).convert('RGB')
              if im.width >= 640: 
                  print('Already improved:',p,im.size)
                  continue
              im=im.resize((800,1000),Image.Resampling.LANCZOS)
              im=im.filter(ImageFilter.UnsharpMask(radius=1.1,percent=155,threshold=2))
              im=ImageEnhance.Contrast(im).enhance(1.04)
              im.save(p,format='PNG',optimize=True)
              print('Enhanced:',p,im.size)
          PY
      - name: Commit enhanced assets
        run: |
          git config user.name 'Cubbon Crayons Publishing'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/parent-corner/appi-ajja-resilience.png assets/parent-corner/appi-cardboard-rocket.png
          git diff --cached --quiet && exit 0
          git commit -m 'Sharpen and upscale article illustrations to 800px'
          git pull --rebase origin main
          git push origin HEAD:main
