name: Activities category quality checks
on:
  push:
    paths:
      - 'activities.html'
      - 'ajji-madila-haadugalu.html'
      - 'activities.css'
      - 'activities.js'
      - '.github/workflows/activities-quality.yml'
permissions:
  contents: read
jobs:
  browser-check:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install browser dependencies
        run: npm install --no-save --no-package-lock playwright@1.58.2
      - name: Test categories, age filters and Purochi links
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8173 --bind 127.0.0.1 >/tmp/activities-server.log 2>&1 &
          node <<'JS'
          const {chromium}=require('playwright');
          const assert=require('node:assert/strict');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            for(const width of [1280,390,320]){
              const context=await browser.newContext({viewport:{width,height:850}});
              const page=await context.newPage();
              const failures=[];page.on('pageerror',e=>failures.push(e.message));
              await page.goto('http://127.0.0.1:8173/activities.html',{waitUntil:'load'});
              assert.equal(await page.locator('.family-collection').count(),3);
              assert.equal(await page.locator('.activity-item:not([hidden])').count(),4);
              assert.equal(await page.locator('.upcoming-list li:not([hidden])').count(),4);
              if(width===390){
                for(const [label,y] of [['top',0],['cards',500],['activities',1040]]){
                  await page.evaluate(y=>window.scrollTo(0,y),y);
                  await page.waitForTimeout(100);
                  const shot=await page.screenshot({type:'jpeg',quality:52});
                  console.log('CC_MOBILE_SCREENSHOT_'+label.toUpperCase()+'_START'+shot.toString('base64')+'CC_MOBILE_SCREENSHOT_'+label.toUpperCase()+'_END');
                }
              }
              await page.locator('button[data-age="2-3"]').click();
              assert.equal(await page.locator('.activity-item:not([hidden])').count(),2);
              await page.locator('button[data-age="4-6"]').click();
              assert.equal(await page.locator('.activity-item:not([hidden])').count(),3);
              await page.locator('button[data-age="all"]').click();
              await page.goto('http://127.0.0.1:8173/activities.html?qa=grandparents#grandparents',{waitUntil:'load'});
              await page.waitForFunction(()=>document.getElementById('collection-context').textContent==='With Grandparents');
              assert.equal(await page.locator('.activity-item:not([hidden])').count(),3);
              assert.equal(await page.locator('.upcoming-list li:not([hidden])').count(),1);
              await page.locator('button[data-age="2-3"]').click();
              assert.equal(await page.locator('.activity-item:not([hidden])').count(),1);
              assert.equal(await page.locator('#ajji-madila-haadugalu:not([hidden])').count(),1);
              await page.locator('button[data-age="all"]').click();
              const heritage=await context.newPage();
              const heritageResponse=await heritage.goto('http://127.0.0.1:8173/ajji-madila-haadugalu.html',{waitUntil:'load'});
              assert.equal(heritageResponse.status(),200);
              assert.ok(await heritage.evaluate(()=>document.documentElement.scrollWidth<=innerWidth+3),'Heritage page horizontal overflow');
              assert.equal(await heritage.locator('#ninnata-hattu-makkalu a[href*="ichlinks.com"]').count(),1);
              await heritage.close();
              assert.equal(await page.locator('a[href="/purochi.html"]').count(),1);
              if(width<650){
                await page.locator('#activities-menu-toggle').click();
                assert.equal(await page.locator('#activities-menu-toggle').getAttribute('aria-expanded'),'true');
                assert.ok(await page.locator('#activities-site-nav').isVisible());
                await page.keyboard.press('Escape');
                assert.equal(await page.locator('#activities-menu-toggle').getAttribute('aria-expanded'),'false');
              }
              await page.locator('a[href="/purochi.html"]').click();
              await page.waitForURL('**/purochi.html');
              assert.equal(await page.locator('#season-audio').count(),1);
              assert.equal(await page.locator('#sync-stage').count(),1);
              assert.ok((await page.locator('.crumbs').innerText()).includes('With Grandparents'));
              const overflow=await page.evaluate(()=>({vw:innerWidth,sw:document.documentElement.scrollWidth,offenders:[...document.querySelectorAll('*')].filter(el=>el.getBoundingClientRect().right>innerWidth+3).slice(0,8).map(el=>({tag:el.tagName,cls:el.className?.toString().slice(0,90),right:Math.round(el.getBoundingClientRect().right)}))}));
              console.log('Overflow diagnostic',width,JSON.stringify(overflow));
              assert.ok(overflow.sw<=overflow.vw+3,'Horizontal overflow '+width);
              assert.deepEqual(failures,[],'JS errors');
              console.log('PASS at viewport '+width);
              await context.close();
            }
            await browser.close();console.log('PASS: activity categories, age filters, deep links, original Purochi audio and animation');
          })().catch(err=>{console.error(err);process.exit(1)});
          JS
