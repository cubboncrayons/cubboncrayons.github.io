name: Enhance article image sharpness
on:
  push:
    paths:
      - '.github/workflows/enhance-article-images.yml'
permissions:
  contents: write
jobs:
  enhance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install processing library
        run: python -m pip install --quiet pillow opencv-contrib-python-headless
      - name: Enhance images with super resolution
        shell: bash
        run: |
          curl --fail --location --retry 3 --silent --show-error https://raw.githubusercontent.com/fannymonori/TF-ESPCN/master/export/ESPCN_x4.pb -o /tmp/ESPCN_x4.pb || true
          if [ ! -s /tmp/ESPCN_x4.pb ]; then
            curl --fail --location --retry 3 --silent --show-error https://raw.githubusercontent.com/Saafke/ESPCN_Tensorflow/master/models/ESPCN_x4.pb -o /tmp/ESPCN_x4.pb
          fi
          python - <<'PY'
          import cv2, os
          from PIL import Image, ImageFilter, ImageEnhance
          paths=['assets/parent-corner/appi-ajja-resilience.png','assets/parent-corner/appi-cardboard-rocket.png']
          sr=cv2.dnn_superres.DnnSuperResImpl_create()
          sr.readModel('/tmp/ESPCN_x4.pb')
          sr.setModel('espcn',4)
          for p in paths:
              im=cv2.imread(p, cv2.IMREAD_COLOR)
              assert im is not None and im.shape[1]==160, (p, getattr(im,'shape',None))
              up=sr.upsample(im)
              result=Image.fromarray(cv2.cvtColor(up,cv2.COLOR_BGR2RGB))
              result=result.filter(ImageFilter.UnsharpMask(radius=1.2, percent=95,threshold=2))
              result.save(p,format='PNG',optimize=True)
              print(p,result.size,os.path.getsize(p))
          PY
      - name: Save enhanced website images
        run: |
          git config user.name 'Cubbon Crayons Publishing'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/parent-corner/appi-ajja-resilience.png assets/parent-corner/appi-cardboard-rocket.png
          git commit -m 'Improve image sharpness for article 02 and 03' && git push
